<div class="col-md-4">
    <div class="card p-4 text-center" data-popup="$id$">
        <img src="$image$" alt="$short_name$" title="$short_name$">
        <h5>$name$</h5>
        <p class="text-muted">$role$</p>
        <p>$institution$</p>
    </div>
    <div id="$id$" class="popup-modal">
        <div class="popup-content">
            <h3>$short_name$</h3>
$body$
            <button class="close-btn">Close</button>
        </div>
    </div>
</div>
